<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniBroker</title>
<style>
    :root {
        --fundo: #0b0e14;
        --painel: #131722;
        --painel-2: #1a1f2e;
        --borda: #232a3b;
        --texto: #e6e9f0;
        --mudo: #8a93a6;
        --verde: #16c784;
        --verde-fundo: rgba(22, 199, 132, 0.12);
        --vermelho: #ea3943;
        --vermelho-fundo: rgba(234, 57, 67, 0.12);
        --azul: #3d7bfd;
        --amarelo: #f0b90b;
        --raio: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background: var(--fundo);
        color: var(--texto);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        min-height: 100vh;
    }
    button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
    input { font: inherit; color: inherit; }
    .num { font-variant-numeric: tabular-nums; }
    .sobe { color: var(--verde); }
    .desce { color: var(--vermelho); }

    /* Topo */
    .topbar {
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 12px 20px;
        background: var(--painel);
        border-bottom: 1px solid var(--borda);
        flex-wrap: wrap;
    }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 18px; white-space: nowrap; }
    .logo-mark {
        width: 32px; height: 32px; border-radius: 8px;
        background: linear-gradient(135deg, var(--azul), var(--verde));
        display: grid; place-items: center; font-weight: 800; color: #fff;
    }
    .logo small { display: block; font-size: 11px; color: var(--mudo); }
    .kpis { display: flex; gap: 28px; flex: 1; flex-wrap: wrap; }
    .kpi span { display: block; font-size: 11px; color: var(--mudo); text-transform: uppercase; letter-spacing: .04em; }
    .kpi strong { font-size: 16px; }
    .tempo { display: flex; align-items: center; gap: 6px; }
    .tempo-label { font-size: 11px; color: var(--mudo); text-transform: uppercase; margin-right: 4px; }
    .tempo button {
        background: var(--painel-2); border: 1px solid var(--borda);
        padding: 8px 12px; border-radius: 8px; font-weight: 600;
    }
    .tempo button:hover { border-color: var(--azul); color: #fff; }
    .tempo button.forte { background: var(--azul); border-color: var(--azul); color: #fff; }
    .relogio { display: flex; flex-direction: column; gap: 4px; }
    .relogio select {
        background: var(--painel-2); border: 1px solid var(--borda); border-radius: 8px;
        padding: 7px 10px; color: var(--texto); font: inherit; font-size: 13px; cursor: pointer;
    }
    .relogio span { font-size: 11px; color: var(--mudo); padding-left: 2px; }
    .progresso { height: 2px; background: var(--borda); }
    .progresso div { height: 100%; width: 0; background: var(--azul); transition: width 1s linear; }

    /* Letreiro */
    .ticker { overflow: hidden; background: #0f131c; border-bottom: 1px solid var(--borda); white-space: nowrap; }
    .ticker-track { display: inline-flex; animation: rolar 150s linear infinite; padding: 7px 0; }
    .ticker:hover .ticker-track { animation-play-state: paused; }
    .ticker-item { padding: 0 22px; font-size: 13px; }
    .ticker-item b { margin-right: 6px; }
    @keyframes rolar { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* Grade principal */
    .grid {
        display: grid;
        grid-template-columns: 270px minmax(0, 1fr) 310px;
        gap: 12px;
        padding: 12px;
    }
    .panel { background: var(--painel); border: 1px solid var(--borda); border-radius: var(--raio); }
    .panel-title {
        font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
        color: var(--mudo); padding: 14px 16px 10px; font-weight: 600;
    }

    /* Lista de ativos */
    .watch { display: flex; flex-direction: column; max-height: 720px; overflow: hidden; }
    #watchlist { overflow-y: auto; flex: 1; padding-bottom: 8px; }
    .watch-topo { padding: 12px 12px 6px; border-bottom: 1px solid var(--borda); }
    .watch-topo input {
        width: 100%; background: var(--fundo); border: 1px solid var(--borda); border-radius: 8px;
        padding: 8px 10px; outline: none; font-size: 13px;
    }
    .watch-topo input:focus { border-color: var(--azul); }
    .filtros { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .filtros button {
        padding: 4px 9px; border-radius: 99px; font-size: 12px; font-weight: 600;
        background: var(--painel-2); color: var(--mudo);
    }
    .filtros button.ativo { background: var(--azul); color: #fff; }
    .grupo { font-size: 11px; color: var(--mudo); padding: 10px 16px 6px; text-transform: uppercase; letter-spacing: .05em; }
    .ativo-linha {
        display: grid; grid-template-columns: 1fr auto; gap: 2px 8px;
        width: 100%; text-align: left; padding: 9px 16px; border-left: 3px solid transparent;
    }
    .ativo-linha:hover { background: var(--painel-2); }
    .ativo-linha.selecionado { background: var(--painel-2); border-left-color: var(--azul); }
    .ativo-linha .sym { font-weight: 700; }
    .ativo-linha .nome { font-size: 12px; color: var(--mudo); }
    .ativo-linha .preco { text-align: right; }
    .ativo-linha .var { text-align: right; font-size: 12px; }

    /* Detalhe */
    .detalhe { padding: 16px; min-width: 0; }
    .det-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    .det-sym { font-size: 22px; font-weight: 800; }
    .det-sym .tipo {
        font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 99px;
        vertical-align: middle; margin-left: 8px;
    }
    .tipo.fixa { background: var(--verde-fundo); color: var(--verde); }
    .tipo.variavel { background: rgba(240, 185, 11, .12); color: var(--amarelo); }
    .ativo-linha.vencido { opacity: .45; }
    .det-nome { color: var(--mudo); margin-top: 2px; }
    .det-preco { text-align: right; }
    .det-preco strong { font-size: 26px; display: block; }
    .chart-bar { display: flex; justify-content: space-between; margin: 16px 0 8px; gap: 8px; flex-wrap: wrap; }
    .seg { display: inline-flex; background: var(--painel-2); border-radius: 8px; padding: 3px; }
    .seg button { padding: 5px 11px; border-radius: 6px; font-size: 12px; color: var(--mudo); font-weight: 600; }
    .seg button.ativo { background: var(--borda); color: var(--texto); }
    .chart-wrap canvas { width: 100%; height: 330px; display: block; cursor: crosshair; }
    .stats {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 1px; background: var(--borda); border: 1px solid var(--borda);
        border-radius: 8px; overflow: hidden; margin-top: 14px;
    }
    .stat { background: var(--painel); padding: 10px 12px; }
    .stat span { display: block; font-size: 11px; color: var(--mudo); margin-bottom: 3px; }
    .stat b { font-size: 14px; }
    .explica {
        margin-top: 14px; padding: 14px 16px; border-radius: 8px;
        background: rgba(61, 123, 253, .08); border: 1px solid rgba(61, 123, 253, .25);
        line-height: 1.55;
    }
    .explica h4 { font-size: 13px; color: var(--azul); margin-bottom: 4px; }

    /* Boleta */
    .boleta { padding-bottom: 16px; }
    .boleta-corpo { padding: 0 16px; }
    .lado { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
    .lado button {
        padding: 10px; border-radius: 8px; font-weight: 700;
        background: var(--painel-2); color: var(--mudo);
    }
    .lado button.compra.ativo { background: var(--verde); color: #04140d; }
    .lado button.venda.ativo { background: var(--vermelho); color: #fff; }
    .boleta label { display: block; font-size: 12px; color: var(--mudo); margin-bottom: 6px; }
    .campo {
        display: flex; align-items: center; background: var(--fundo);
        border: 1px solid var(--borda); border-radius: 8px; overflow: hidden;
    }
    .campo:focus-within { border-color: var(--azul); }
    .campo input {
        flex: 1; min-width: 0; background: none; border: none; outline: none;
        padding: 10px; font-size: 16px; font-weight: 700; text-align: center;
    }
    .campo button, .campo span { padding: 10px 14px; color: var(--mudo); font-size: 16px; font-weight: 700; }
    .campo button:hover { color: var(--texto); }
    .atalhos { display: flex; gap: 6px; margin: 8px 0 14px; }
    .atalhos button {
        flex: 1; padding: 6px 0; border-radius: 6px; font-size: 12px;
        background: var(--painel-2); color: var(--mudo); font-weight: 600;
    }
    .atalhos button:hover { color: var(--texto); }
    .linha { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 13px; }
    .linha span { color: var(--mudo); }
    .linha b { text-align: right; }
    .linha.total { border-top: 1px solid var(--borda); margin-top: 4px; padding-top: 10px; font-size: 15px; }
    .enviar {
        width: 100%; padding: 13px; border-radius: 8px; font-weight: 800;
        font-size: 15px; margin-top: 12px;
    }
    .enviar.compra { background: var(--verde); color: #04140d; }
    .enviar.venda { background: var(--vermelho); color: #fff; }
    .enviar:disabled { opacity: .35; cursor: not-allowed; }
    .separador { border: none; border-top: 1px solid var(--borda); margin: 18px 0 4px; }
    .dica { font-size: 12px; color: var(--mudo); line-height: 1.5; margin-top: 12px; }
    .vazio { color: var(--mudo); font-size: 13px; padding: 6px 0; }

    /* Parte de baixo */
    .inferior { margin: 0 12px 12px; }
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--borda); padding: 0 12px; overflow-x: auto; }
    .tabs button {
        padding: 13px 14px; color: var(--mudo); font-weight: 600;
        border-bottom: 2px solid transparent; white-space: nowrap;
    }
    .tabs button.ativo { color: var(--texto); border-bottom-color: var(--azul); }
    .aba { padding: 12px 16px 16px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { font-size: 11px; color: var(--mudo); text-transform: uppercase; font-weight: 600; text-align: right; padding: 8px 10px; }
    td { padding: 11px 10px; text-align: right; border-top: 1px solid var(--borda); white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: var(--painel-2); }
    .barra-alocacao { display: flex; height: 10px; border-radius: 99px; overflow: hidden; margin: 6px 0 14px; background: var(--painel-2); }
    .legenda { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--mudo); margin-bottom: 10px; }
    .legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
    #graficoPatrimonio { width: 100%; height: 280px; display: block; cursor: crosshair; }
    .extrato-item { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--borda); }
    .extrato-item:first-child { border-top: none; }
    .extrato-item small { color: var(--mudo); display: block; }
    .extrato-item b { white-space: nowrap; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
    .card { background: var(--painel-2); border-radius: 8px; padding: 14px; line-height: 1.55; }
    .card h4 { margin-bottom: 6px; }

    /* Vida e carreira */
    .cards.vida { grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); align-items: start; }
    .trilha { text-align: left; border: 1px solid transparent; }
    .trilha:hover { border-color: var(--azul); }
    .trilha small { display: block; color: var(--mudo); font-size: 12px; }
    .escada { list-style: none; }
    .escada li { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: 13px; color: var(--mudo); }
    .escada li.feito { color: var(--verde); }
    .escada li.atual { color: var(--texto); font-weight: 700; }
    .escada li span:last-child { white-space: nowrap; }
    .opcao {
        display: flex; justify-content: space-between; align-items: center; gap: 10px;
        width: 100%; text-align: left; padding: 8px 10px; margin-top: 6px;
        border: 1px solid var(--borda); border-radius: 8px;
    }
    .opcao:hover { border-color: var(--azul); }
    .opcao.ativo { border-color: var(--azul); background: rgba(61, 123, 253, .12); }
    .opcao small { display: block; color: var(--mudo); font-size: 12px; line-height: 1.4; }
    .opcao b { white-space: nowrap; }
    .meta { height: 8px; border-radius: 99px; background: var(--fundo); overflow: hidden; margin: 10px 0; }
    .meta div { height: 100%; background: var(--verde); border-radius: 99px; }
    .seg.quebra { flex-wrap: wrap; }
    .trilha.ativo { border-color: var(--azul); }
    .link-botao { color: var(--mudo); font-size: 12px; text-decoration: underline; margin-top: 12px; }
    .link-botao:hover { color: var(--texto); }

    .rodape {
        display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
        padding: 4px 24px 24px; color: var(--mudo); font-size: 12px; line-height: 1.5;
    }
    .rodape button { border: 1px solid var(--borda); padding: 7px 12px; border-radius: 8px; color: var(--mudo); }
    .rodape button:hover { color: var(--vermelho); border-color: var(--vermelho); }
    .toast {
        position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px);
        background: var(--painel-2); border: 1px solid var(--borda); border-left: 4px solid var(--azul);
        padding: 14px 18px; border-radius: 10px; max-width: min(520px, calc(100vw - 32px));
        box-shadow: 0 12px 40px rgba(0, 0, 0, .5); line-height: 1.5;
        opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 10;
    }
    .toast.visivel { opacity: 1; transform: translate(-50%, 0); }
    .toast.erro { border-left-color: var(--vermelho); }
    .toast.ok { border-left-color: var(--verde); }
    .amarelo { color: var(--amarelo); }
    .cofrinho {
        text-align: left; padding: 6px 12px; border-radius: 8px;
        border: 1px solid var(--verde); background: var(--verde-fundo);
        animation: brilho 2s ease-in-out infinite;
    }
    .cofrinho strong { color: var(--verde); }
    .cofrinho:hover { background: rgba(22, 199, 132, .22); }
    .cofrinho:disabled { border-color: var(--borda); background: none; animation: none; cursor: default; }
    .cofrinho:disabled strong { color: var(--texto); }
    @keyframes brilho { 50% { box-shadow: 0 0 0 4px rgba(22, 199, 132, .15); } }
    .selo-contador {
        display: none; min-width: 18px; padding: 1px 6px; border-radius: 99px;
        background: var(--vermelho); color: #fff; font-size: 11px; margin-left: 4px;
    }
    .det-noticias { margin-top: 14px; }
    .det-noticias h4 { font-size: 13px; color: var(--mudo); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
    .noticia { padding: 12px 0; border-top: 1px solid var(--borda); line-height: 1.5; }
    .det-noticias .noticia:first-of-type, .aba > .noticia:first-child { border-top: none; }
    .noticia-topo { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .noticia-topo small { color: var(--mudo); }
    .noticia h5 { font-size: 15px; margin-bottom: 2px; }
    .noticia p { color: var(--mudo); font-size: 13px; }
    .selo {
        display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
        padding: 2px 7px; border-radius: 4px; margin-right: 6px;
    }
    .selo.empresa { background: rgba(61, 123, 253, .15); color: var(--azul); }
    .selo.setor { background: rgba(168, 85, 247, .15); color: #c084fc; }
    .selo.economia { background: rgba(240, 185, 11, .15); color: var(--amarelo); }
    .selo.resultado { background: var(--verde-fundo); color: var(--verde); }
    .selo.cisne { background: rgba(255, 255, 255, .12); color: #e6e9f0; }
    .selo.rumor { background: rgba(234, 57, 67, .15); color: #ff7a82; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
    .chip { background: var(--painel-2); border: 1px solid var(--borda); border-radius: 6px; padding: 3px 8px; font-size: 12px; }
    .chip:hover { border-color: var(--azul); }
    .chips .mais { font-size: 12px; color: var(--mudo); }
    .dica-chip { display: block; font-size: 11px; color: var(--mudo); margin-top: 4px; }
    .tabela-resultados { margin-top: 8px; }
    .tabela-resultados td { padding: 7px 10px; }
    .toast.noticia { border-left-color: var(--amarelo); cursor: pointer; padding: 14px 18px; }
    .toast .link { color: var(--azul); }

    @media (max-width: 1150px) {
        .grid { grid-template-columns: 250px minmax(0, 1fr); }
        .boleta { grid-column: 1 / -1; }
    }
    @media (max-width: 760px) {
        .grid { grid-template-columns: 1fr; padding: 8px; }
        .inferior { margin: 0 8px 8px; }
        .watch { max-height: 300px; }
        .topbar { padding: 12px 16px; gap: 14px; }
        .kpis { gap: 16px; }
        .chart-wrap canvas { height: 260px; }
    }
</style>
</head>
<body>

<header class="topbar">
    <div class="logo">
        <div class="logo-mark">M</div>
        <div>MiniBroker<small>dinheiro de mentira, mercado de verdade</small></div>
    </div>
    <div class="kpis">
        <div class="kpi"><span>Data</span><strong id="kData" class="num"></strong></div>
        <div class="kpi" title="Seu cargo atual. Veja o salário e as promoções na aba Vida e carreira"><span>Profissão</span><strong id="kCargo"></strong></div>
        <div class="kpi"><span>Saldo disponível</span><strong id="kCaixa" class="num"></strong></div>
        <div class="kpi"><span>Patrimônio total</span><strong id="kPatrimonio" class="num"></strong></div>
        <div class="kpi" title="Quanto seu patrimônio (investimentos e bens) ganhou ou perdeu, sem contar o dinheiro que você guardou do salário"><span>Resultado</span><strong id="kResultado" class="num"></strong></div>
        <div class="kpi" title="A Selic é a taxa básica de juros. O Copom, do Banco Central, decide a Selic a cada 3 meses, numa quarta-feira"><span>Selic · próximo Copom</span><strong id="kSelic" class="num"></strong></div>
        <div class="kpi" title="Governo eleito e data da próxima eleição. O perfil do governo muda os juros e a inflação no longo prazo"><span>Governo · próxima eleição</span><strong id="kGoverno"></strong></div>
        <div class="kpi" title="O que sobra do salário depois dos impostos e do custo de vida. Cai no saldo no começo de cada mês"><span>Sobra do mês</span><strong id="kSobra" class="num"></strong></div>
        <button class="kpi cofrinho" id="proventos" title="Passar os dividendos para o saldo disponível"></button>
    </div>
    <div class="tempo">
        <span class="tempo-label">Avançar</span>
        <button data-dias="21" class="forte">1 mês</button>
        <button data-dias="252">1 ano</button>
    </div>
    <div class="relogio">
        <select id="velocidade" aria-label="Velocidade do tempo">
            <option value="0">Tempo pausado</option>
            <option value="1">1x · um dia a cada 1 min</option>
            <option value="2">2x · um dia a cada 30 s</option>
            <option value="3">3x · um dia a cada 20 s</option>
            <option value="4">4x · um dia a cada 15 s</option>
        </select>
        <span id="contagem" class="num"></span>
    </div>
</header>
<div class="progresso"><div id="progresso"></div></div>

<div class="ticker"><div class="ticker-track" id="ticker"></div></div>

<main class="grid">
    <aside class="panel watch">
        <div class="watch-topo">
            <input id="busca" type="search" placeholder="Buscar ativo (ex.: PETR4, CDB)" autocomplete="off">
            <div class="filtros" id="filtros">
                <button data-f="todos" class="ativo">Todos</button>
                <button data-f="fixa">Renda fixa</button>
                <button data-f="acao">Ações</button>
                <button data-f="fii">FIIs</button>
                <button data-f="etf">ETFs</button>
            </div>
        </div>
        <div id="watchlist"></div>
    </aside>

    <section class="panel detalhe">
        <div class="det-head">
            <div>
                <div class="det-sym" id="dSym"></div>
                <div class="det-nome" id="dNome"></div>
            </div>
            <div class="det-preco">
                <strong id="dPreco" class="num"></strong>
                <span id="dVar" class="num"></span>
            </div>
        </div>
        <div class="chart-bar">
            <div class="seg" id="periodos">
                <button data-n="21">1M</button>
                <button data-n="63">3M</button>
                <button data-n="126">6M</button>
                <button data-n="252">1A</button>
                <button data-n="100000">Tudo</button>
            </div>
            <div class="seg" id="modos">
                <button data-modo="velas">Velas</button>
                <button data-modo="linha">Linha</button>
            </div>
        </div>
        <div class="chart-wrap"><canvas id="grafico"></canvas></div>
        <div class="stats" id="dStats"></div>
        <div class="explica" id="dExplica"></div>
        <div class="det-noticias" id="dNoticias"></div>
    </section>

    <aside class="panel boleta" id="boleta"></aside>
</main>

<section class="panel inferior">
    <div class="tabs" id="tabs">
        <button data-aba="carteira">Minha carteira</button>
